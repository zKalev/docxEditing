spring.application.name=docs-backend
server.port=8080

# Where .docx files live (relative to the backend working directory). A sample.docx is created if it is empty.
app.storage-dir=${APP_STORAGE_DIR:storage}

# Origin(s) of the Vue dev server allowed by CORS, comma-separated. Any other origin gets 403 "Invalid CORS request".
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}

# Public URL of ONLYOFFICE Document Server, as the BROWSER sees it (api.js is loaded from here).
onlyoffice.document-server-url=${ONLYOFFThe document security token is not correctly formedICE_URL:http://localhost:8081}

# URL of THIS backend as seen from INSIDE the Document Server container.
# Document Server downloads the file and posts callbacks to this address, so it must not be "localhost".
#   Docker:  http://host.docker.internal:8080   (run the container with --add-host=host.docker.internal:host-gateway)
#   Podman:  http://host.containers.internal:8080
onlyoffice.backend-url-for-document-server=${BACKEND_URL_FOR_DS:http://host.docker.internal:8080}

# Must equal the JWT_SECRET env var passed to the Document Server container (at least 32 characters).
# Leave empty only if the container runs with JWT_ENABLED=false.
onlyoffice.jwt-secret=${ONLYOFFICE_JWT_SECRET:poc-onlyoffice-jwt-secret-change-me-0123456789}


podman run -d -p 8081:80   --name onlyoffice  -e JWT_SECRET=poc-onlyoffice-jwt-secret-change-me-0123456789  -e ALLOW_PRIVATE_IP_ADDRESS=true  onlyoffice/documentserver:9.4